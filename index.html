
<!DOCTYPE html>
<html>
<head>
<title>Buy USDT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;text-align:center}
.card{background:white;padding:25px;margin:auto;margin-top:40px;width:340px;border-radius:10px}
input{width:92%;padding:10px;margin:8px}
button{padding:10px 20px;background:#28a745;color:white;border:none;border-radius:6px}
</style>
</head>

<body>

<div class="card">
<h2>Buy USDT</h2>

<input type="number" id="usdt" placeholder="Enter USDT Amount">

<input type="text" id="wallet" placeholder="Your USDT Wallet Address">

<input type="file" id="screenshot">

<button onclick="createOrder()">Submit Order</button>

<div id="result"></div>
<div id="payment"></div>

</div>

<script>

let price = localStorage.getItem("usdt_price") || 90
let payment = localStorage.getItem("payment_method") || "UPI: yourupi@bank"

let BOT_TOKEN = "8567657774:AAH1YZh4GFC9NKTG6qYBaPLaE_Uf02gdYH0"
let CHAT_ID = "5564502051"

function createOrder(){

let usdt=document.getElementById("usdt").value
let wallet=document.getElementById("wallet").value
let file=document.getElementById("screenshot").files[0]

if(usdt=="" || wallet=="" || !file){
alert("Fill all fields and upload screenshot")
return
}

let total = usdt * price

let orders = JSON.parse(localStorage.getItem("orders")||"[]")

orders.push({
usdt:usdt,
wallet:wallet,
rupees:total,
time:new Date().toLocaleString()
})

localStorage.setItem("orders",JSON.stringify(orders))

let caption = `New USDT Order

USDT: ${usdt}
INR: ₹${total}
Wallet: ${wallet}`

let formData = new FormData()

formData.append("chat_id",CHAT_ID)
formData.append("caption",caption)
formData.append("photo",file)

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{

alert("Order Sent Successfully")

document.getElementById("result").innerHTML="Pay ₹"+total
document.getElementById("payment").innerHTML="Payment Method: "+payment

})

}

</script>

</body>
</html>

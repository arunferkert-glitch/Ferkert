
<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;text-align:center}
.box{background:white;padding:25px;margin:auto;margin-top:30px;width:360px;border-radius:10px}
input{width:90%;padding:10px;margin:10px}
button{padding:10px 20px;background:#007bff;color:white;border:none;border-radius:6px}
</style>
</head>

<body>

<div class="box">
<h2>Admin Settings</h2>

<input type="number" id="price" placeholder="USDT Price">

<input type="text" id="payment" placeholder="Payment Method">

<button onclick="update()">Update</button>

</div>

<div class="box">
<h2>Total Orders</h2>

<h3 id="total"></h3>

<div id="orders"></div>

</div>

<script>

function update(){

let price=document.getElementById("price").value
let payment=document.getElementById("payment").value

localStorage.setItem("usdt_price",price)
localStorage.setItem("payment_method",payment)

alert("Settings Updated")

}

function loadOrders(){

let orders = JSON.parse(localStorage.getItem("orders")||"[]")

let html=""

orders.forEach((o,i)=>{

html+=`<p>
Order #${i+1}<br>
USDT: ${o.usdt}<br>
Wallet: ${o.wallet}<br>
INR: ${o.rupees}<br>
Time: ${o.time}
<hr>
</p>`

})

document.getElementById("orders").innerHTML=html
document.getElementById("total").innerHTML=orders.length

}

loadOrders()

</script>

</body>
</html>
